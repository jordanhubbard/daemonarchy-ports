name: Owe native inotify compatibility

on:
  pull_request:
    paths:
      - 'Tools/daemonarchy/ci-apt.sh'
      - 'Tools/daemonarchy/test_ci_apt.py'
      - 'x11/owe/**'
      - 'Tools/daemonarchy/test-owe-native.sh'
      - '.github/workflows/owe-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owe-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-port:
    strategy:
      fail-fast: false
      matrix:
        release: ['14.4', '15.1']
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
      - name: Require selected port capacity
        run: |
          python3 - <<'PY'
          import pathlib, shutil
          assert shutil.disk_usage('.').free >= 32 * 1024**3
          memory = dict(line.split(':', 1) for line in pathlib.Path('/proc/meminfo').read_text().splitlines())
          assert int(memory['MemAvailable'].split()[0]) * 1024 >= 8 * 1024**3
          PY
      - name: Bootstrap signed Ubuntu VM tools
        run: |
          python3 Tools/daemonarchy/test_ci_apt.py
          bash Tools/daemonarchy/ci-apt.sh --no-install-recommends qemu-utils qemu-system-x86 ovmf
      - name: Check original port in disposable FreeBSD guest
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc
        with:
          release: ${{ matrix.release }}
          arch: x86_64
          mem: '4096'
          cpu: '2'
          sync: rsync
          run: |
            mkdir -p _build/owe-driver
            code=0
            timeout -k 30 2400 sh Tools/daemonarchy/test-owe-native.sh ${{ github.sha }} > _build/owe-driver/run.stdout 2> _build/owe-driver/run.stderr || code=$?
            printf '%s\n' "$code" > _build/owe-driver/exit-status
      - name: Require success after evidence sync
        run: |
          if ! test "$(cat _build/owe-driver/exit-status)" = 0; then
            tail -n 100 _build/owe-driver/run.stdout
            tail -n 100 _build/owe-driver/run.stderr
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owe-native-${{ matrix.release }}
          path: |
            _build/owe-native/
            _build/owe-driver/
          if-no-files-found: warn
